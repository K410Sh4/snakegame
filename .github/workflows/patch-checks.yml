name: SnakeGame patch checks

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-regression:
    name: Canonical patch invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python static regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  luau-syntax:
    name: Compile all Luau patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Luau compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          path: .luau-toolchain
          fetch-depth: 1
      - name: Configure Luau compiler
        run: cmake -S .luau-toolchain -B .luau-toolchain/build -DCMAKE_BUILD_TYPE=Release
      - name: Build official Luau CLI
        run: cmake --build .luau-toolchain/build --target Luau.Compile.CLI Luau.Repl.CLI -j2
      - name: Compile patch files and embedded bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "tests")
          from test_patch_chain import bootstrap_script
          folder = pathlib.Path("/tmp/snakegame-embedded")
          folder.mkdir(exist_ok=True)
          (folder / "SnakeGameServer.lua").write_text(bootstrap_script("serverSource"), encoding="utf-8")
          (folder / "SnakeGameClient.lua").write_text(bootstrap_script("clientSource"), encoding="utf-8")
          PY
          count=0
          for script in updates/*.lua /tmp/snakegame-embedded/*.lua; do
            echo "Compiling $script"
            .luau-toolchain/build/luau-compile "$script" >/dev/null
            count=$((count + 1))
          done
          test "$count" -eq 21
          echo "Compiled 19 patch files and 2 embedded bootstrap scripts (syntax only)."
      - name: Apply and reapply all 19 patches in mocked Studio
        shell: bash
        run: |
          set -euo pipefail
          {
            cat tests/mock_studio_prelude.luau
            for script in updates/*.lua; do
              printf '\ndo\nlocal function applyPatch()\n'
              cat "$script"
              printf '\nend\napplyPatch()\n'
              case "$script" in
                */0001_*) ;;
                *) printf 'applyPatch()\n' ;;
              esac
              printf 'end\n'
            done
            cat tests/mock_studio_postlude.luau
          } > /tmp/snakegame_mock_install.luau
          .luau-toolchain/build/luau /tmp/snakegame_mock_install.luau > /tmp/mock_output.txt
          grep -E '^\[MockStudio\]' /tmp/mock_output.txt
      - name: Exercise installed paint cache with destructive lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server=Path("/tmp/SnakeGameServer.lua").read_text(encoding="utf-8")
          begin="local function paint(s)"
          end="local function reset(player)"
          assert server.count(begin)==1 and server.count(end)==1, "paint/reset anchors changed"
          body=server.split(begin,1)[1].split(end,1)[0]
          assert "p.Parent~=segments" in body and "food.Parent~=model" in body
          extracted="local function paint(s)"+body+"\n"
          # The harness tests the real generated paint, not a copied algorithm.
          harness=Path("tests/cache_recovery_behavior.luau").read_text(encoding="utf-8")
          marker="-- Extracted paint(s) is inserted here by the workflow."
          assert harness.count(marker)==1
          Path("/tmp/cache_recovery_behavior.luau").write_text(harness.replace(marker,extracted),encoding="utf-8")
          PY
          .luau-toolchain/build/luau-compile /tmp/cache_recovery_behavior.luau >/dev/null
          .luau-toolchain/build/luau /tmp/cache_recovery_behavior.luau
      - name: Compile final installed server/client Luau sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          transcript=Path("/tmp/mock_output.txt").read_text(encoding="utf-8")
          for role in ("SERVER", "CLIENT"):
              begin=f"MOCK_SNAKE_{role}_SOURCE_START\n"
              end=f"\nMOCK_SNAKE_{role}_SOURCE_END"
              assert transcript.count(begin)==1 and transcript.count(end)==1, f"{role}: missing boundary"
              body=transcript.split(begin,1)[1].split(end,1)[0]
              assert len(body)>1000, f"{role}: suspiciously short generated source"
              Path(f"/tmp/SnakeGame{role.title()}.lua").write_text(body, encoding="utf-8")
          PY
          .luau-toolchain/build/luau-compile /tmp/SnakeGameServer.lua >/dev/null
          .luau-toolchain/build/luau-compile /tmp/SnakeGameClient.lua >/dev/null
          echo "Final installed server/client source syntax: valid (not Studio runtime)."
