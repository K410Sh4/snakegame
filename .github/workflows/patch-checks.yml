name: SnakeGame patch checks

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-regression:
    name: Canonical patch invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python static regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  luau-syntax:
    name: Compile all Luau patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Luau compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          path: .luau-toolchain
          fetch-depth: 1
      - name: Configure Luau compiler
        run: cmake -S .luau-toolchain -B .luau-toolchain/build -DCMAKE_BUILD_TYPE=Release
      - name: Build official Luau CLI
        run: cmake --build .luau-toolchain/build --target Luau.Compile.CLI -j2
      - name: Compile patch files and embedded bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "tests")
          from test_patch_chain import bootstrap_script
          folder = pathlib.Path("/tmp/snakegame-embedded")
          folder.mkdir(exist_ok=True)
          (folder / "SnakeGameServer.lua").write_text(bootstrap_script("serverSource"), encoding="utf-8")
          (folder / "SnakeGameClient.lua").write_text(bootstrap_script("clientSource"), encoding="utf-8")
          PY
          count=0
          for script in updates/*.lua /tmp/snakegame-embedded/*.lua; do
            echo "Compiling $script"
            .luau-toolchain/build/luau-compile "$script" >/dev/null
            count=$((count + 1))
          done
          test "$count" -eq 20
          echo "Compiled 18 patch files and 2 embedded bootstrap scripts (syntax only)."
